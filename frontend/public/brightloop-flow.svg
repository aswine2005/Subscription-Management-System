<svg xmlns="http://www.w3.org/2000/svg" width="960" height="268" viewBox="0 0 960 268" role="img" aria-labelledby="title description">
  <title id="title">Brightloop subscription operations</title>
  <desc id="description">Plans flow into recurring invoices, receipts and recovery, then renew for the next cycle.</desc>
  <defs>
    <linearGradient id="paper" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#fbfcf7"/>
      <stop offset="1" stop-color="#eef2e5"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" x2="1">
      <stop offset="0" stop-color="#879b68"/>
      <stop offset="1" stop-color="#b56a4b"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-20%" width="130%" height="150%">
      <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#263e32" flood-opacity=".09"/>
    </filter>
  </defs>
  <rect width="960" height="268" rx="18" fill="url(#paper)"/>
  <circle cx="900" cy="17" r="90" fill="#e4ead8" opacity=".6"/>
  <text x="42" y="42" fill="#65765b" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="11" font-weight="700" letter-spacing="2.3">THE SUBSCRIPTION CYCLE · BUILT TO RUN TOGETHER</text>
  <text x="42" y="72" fill="#263c31" font-family="Georgia,Times New Roman,serif" font-size="25">One clear path from plan to payment.</text>

  <g filter="url(#shadow)">
    <rect x="42" y="99" width="245" height="92" rx="12" fill="#fffefa" stroke="#e1e7d9"/>
    <rect x="357" y="99" width="245" height="92" rx="12" fill="#fffefa" stroke="#e1e7d9"/>
    <rect x="672" y="99" width="245" height="92" rx="12" fill="#fffefa" stroke="#e1e7d9"/>
  </g>

  <g font-family="system-ui,-apple-system,Segoe UI,sans-serif">
    <circle cx="70" cy="128" r="14" fill="#e8eedf"/><text x="70" y="132" fill="#466247" font-size="10" font-weight="700" text-anchor="middle">01</text>
    <text x="94" y="131" fill="#354b3b" font-size="12" font-weight="700" letter-spacing="1.2">SET THE TERMS</text>
    <text x="70" y="164" fill="#697567" font-size="13">Products · plans · quotations</text>

    <circle cx="385" cy="128" r="14" fill="#f3e9dd"/><text x="385" y="132" fill="#99583d" font-size="10" font-weight="700" text-anchor="middle">02</text>
    <text x="409" y="131" fill="#354b3b" font-size="12" font-weight="700" letter-spacing="1.2">BILL WITH CONFIDENCE</text>
    <text x="385" y="164" fill="#697567" font-size="13">Live contracts · duplicate-safe</text>

    <circle cx="700" cy="128" r="14" fill="#e8eedf"/><text x="700" y="132" fill="#466247" font-size="10" font-weight="700" text-anchor="middle">03</text>
    <text x="724" y="131" fill="#354b3b" font-size="12" font-weight="700" letter-spacing="1.2">FOLLOW THE CASH</text>
    <text x="700" y="164" fill="#697567" font-size="13">Receipts · recovery · reporting</text>
  </g>

  <path d="M287 145H355 M602 145H670" fill="none" stroke="#c9d2bd" stroke-width="2"/>
  <path d="M287 145H355 M602 145H670" fill="none" stroke="url(#flow)" stroke-width="2" stroke-dasharray="5 13" stroke-linecap="round">
    <animate attributeName="stroke-dashoffset" from="0" to="-36" dur="1.6s" repeatCount="indefinite"/>
  </path>
  <path id="cycle" d="M790 201 C790 239 172 239 172 201" fill="none" stroke="#a5b594" stroke-width="1.4" stroke-dasharray="4 7" stroke-linecap="round"/>
  <path d="M166 207l6-9 6 9" fill="none" stroke="#85966f" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <circle r="4" fill="#af6547">
    <animateMotion dur="5.5s" repeatCount="indefinite" path="M287 145H670"/>
  </circle>
  <text x="480" y="231" fill="#6f7c68" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="10" font-weight="600" letter-spacing="1.4" text-anchor="middle">ONE CONNECTED, REPEATABLE BILLING MONTH</text>
</svg>
